name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri

      - name: 编译（Release · x64）
        working-directory: windows-app/src-tauri
        run: cargo build --release

      - name: 整理产物与校验和
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/wbmemorymigrator.exe dist/WBMemoryMigrator-1.3-win-x64.exe
          $h = (Get-FileHash dist/WBMemoryMigrator-1.3-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WBMemoryMigrator-1.3-win-x64.exe" | Out-File dist/checksums.txt -Encoding ascii
          Get-ChildItem dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WBMemoryMigrator-1.3-win-x64
          path: dist/*
          retention-days: 30
